name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # v3.8.ajg added `directUrl = env("DIRECT_URL")` to schema.prisma.
      # CI doesn't run a pooler — both URLs can point at the same plain
      # Postgres container. The variable just needs to exist so prisma
      # validate doesn't fail with P1012 ("Environment variable not
      # found: DIRECT_URL"). Sub-pattern 11 (CI-parity) fire: this env
      # block was missed in ajg; CI exposed the gap on the first push
      # after ajh shipped.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-test-secret
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4
        with:
          # Depth 2 so the reachability gate has something to diff
          # against. The default shallow clone has no parent commit, so `HEAD^`
          # does not resolve and the gate would judge an empty diff — passing
          # while checking nothing, which is the worst way for a gate to fail.
          #
          # `HEAD^` is correct for BOTH event types this workflow fires on: on a
          # push it is the previous tip of main, and on a pull_request checkout@v4
          # builds a merge commit whose first parent is the base branch. One
          # expression, no branching.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          # Arc 12 — was 20, while backend/package.json has declared
          # engines.node ^24 since v3.8.alg and local dev runs 24. CI was
          # building on a Node the repo says it does not support; jsdom 30
          # is simply the first dependency to notice (its bundled undici
          # calls webidl.util.markAsUncloneable, absent on 20).
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

      # The two v3.8.asc content gates run here, not just on someone's laptop.
      #
      # Both were written in v3.8.asc and both immediately caught real defects, but
      # neither was wired in, so the guarantee was "someone remembered" rather than
      # "the build enforces it" — the same shape as the problem they exist to solve.
      #
      # The accessorial gate fails when a document states a retired figure, or when
      # a contractual surface hardcodes a still-correct one. A literal 250 is right
      # today and silently wrong the day the cap moves; that is how the schedule
      # drifted the first time, with production serving $50/hr on the rate
      # confirmation and $75/hr in SRL's own operations manual.
      - name: Accessorial standard holds
        run: npx tsx scripts/verify-accessorial-standard.ts

      # The reachability gate fails on work nothing consumes — a dead export, an
      # endpoint with no caller, a column written and never read, a page behind a
      # 301. It diffs against the merge base, so it only judges what this push adds.
      - name: Nothing shipped is unreachable
        run: npx tsx scripts/verify-reachability.ts HEAD^

      # A field a handler reads but its Zod schema does not declare is stripped
      # by validateBody and is undefined at runtime — no type error, no runtime
      # error. That shipped twice: tonuFaultSide made TONU impossible to record,
      # and totpCode made password reset impossible for any TOTP-enabled user.
      # Strict because the surface is clean as of Arc 4; a route can opt out with
      # `// schema-drift-ok: <reason>` above it, which records the reason in the
      # source rather than in someone's memory.
      - name: Every field a handler reads is declared
        run: npx tsx scripts/audit-schema-drift.ts --strict

      - run: npm audit --omit=dev --audit-level=high || true

  frontend:
    name: Frontend - Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Arc 12 — was 20, while backend/package.json has declared
          # engines.node ^24 since v3.8.alg and local dev runs 24. CI was
          # building on a Node the repo says it does not support; jsdom 30
          # is simply the first dependency to notice (its bundled undici
          # calls webidl.util.markAsUncloneable, absent on 20).
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx next lint

      # Arc 12 — component + store tests (vitest + React Testing Library,
      # jsdom). Placed IN this job rather than as a fourth one, mirroring the
      # backend job, which runs lint + test + build together and gates deploy.
      #
      # These gate the deploy, and that is deliberate: they cover the carrier
      # auth path, where the v3.8.ato bug was a lockout that looped every
      # enrolled carrier between login and dashboard. A broken assertion there
      # SHOULD stop a release.
      #
      # E2E gates the deploy too now (§13.3 Item 273.12 shape (a)), so this is
      # no longer in tension with anything — but it once was, and the reason
      # it stopped being worth recording. E2E was excluded because it
      # downloads Playwright browsers and stands up Postgres — infrastructure
      # that once hung for six hours (v3.8.asv) on a failure unrelated to any
      # code, with no timeout to bound it. These tests run in jsdom with no
      # network and no download step, which was always the same risk profile
      # as the backend tests that already gated deploy — the rule was never
      # "frontend tests do not gate"; it was "an unbounded infrastructure job
      # does not gate". E2E now carries `timeout-minutes: 25`, which is what
      # let it rejoin the jobs that do.
      - run: npm test

      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.silkroutelogistics.ai/api

  # v3.8.aaq — Sprint 37 E2E lifecycle smoke + brand-skill regression lock.
  # Spins up real Postgres + backend + frontend (static export served via
  # `serve`) and walks one full load lifecycle. PDF assertions catch any
  # regression of Sprint 30 / Sprint 33 closed fixes.
  e2e:
    name: E2E - Full Lifecycle Smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # A Playwright browser download once hung for 6h02m (§13.3 Item 198) with
    # nothing to bound it, which is why E2E used to sit outside the deploy
    # gate. This timeout is the fix, not the exclusion: it turns an unbounded
    # hang into a 25-minute wait, which is what let E2E back into `deploy`'s
    # `needs:` (§13.3 Item 273.12 shape (a)) — see that job's own header
    # comment. A hang should still FAIL rather than burn a runner for hours
    # and leave the result ambiguous; now it also fails fast enough that
    # waiting on it is affordable.
    timeout-minutes: 25

    # Job-level permissions REPLACE the default for this job, so `contents:
    # read` has to be restated for actions/checkout. `issues: write` is only
    # for the pinned E2E-red issue below; no other job gets it.
    permissions:
      contents: read
      issues: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      # v3.8.ajg added `directUrl = env("DIRECT_URL")` to schema.prisma.
      # Same as backend job above — CI has no pooler so both URLs point
      # at the same Postgres container. Required for `prisma db push`
      # at line 126 to not fail with P1012.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-test-secret
      JWT_EXPIRES_IN: 24h
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      E2E_BYPASS_OTP: "true"
      E2E_FIXTURES: "true"
      NEXT_PUBLIC_API_URL: http://localhost:3110/api
      PORT: "3110"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Arc 12 — was 20, while backend/package.json has declared
          # engines.node ^24 since v3.8.alg and local dev runs 24. CI was
          # building on a Node the repo says it does not support; jsdom 30
          # is simply the first dependency to notice (its bundled undici
          # calls webidl.util.markAsUncloneable, absent on 20).
          node-version: 24

      - name: Install root deps (Playwright, pdf-parse)
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps + serve
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save serve

      - name: Apply schema + seed (with E2E fixtures)
        working-directory: backend
        # CI test DB uses `db push` because each CI run starts on a
        # fresh Postgres container — no migration history to align
        # with, and `db push` is the fastest path to apply the
        # current `schema.prisma` against an empty DB.
        #
        # Production deployment is DIFFERENT: per CLAUDE.md §2.2
        # "Production Deployment (Canonical)" the prod build chain
        # uses `prisma migrate deploy` + `prisma migrate status
        # --exit-code` gate. Sprint 44b (2026-05-09) restored the
        # canonical migration chain after the v3.8.aa-dd db-push-
        # to-prod drift was caught (Item 8.10). `db push` against
        # production is now deprecated — see §2.2 schema mutation
        # paths section.
        #
        # The `CREATE EXTENSION citext` pre-step is required because
        # v3.8.ale converted `User.email` to `@db.Citext` for
        # DB-level case-insensitive uniqueness. The citext extension
        # is a Postgres contrib module (not in base install) that
        # must be explicitly enabled before any column can use the
        # citext type. The v3.8.ale migration file at
        # prisma/migrations/20260526164943_email_citext/migration.sql
        # includes `CREATE EXTENSION IF NOT EXISTS citext;` as its
        # first statement — that path works on prod where Render
        # runs `prisma migrate deploy`. But CI uses `prisma db push`
        # which bypasses migrations entirely + pushes schema
        # directly, so the extension never gets created. Without
        # this pre-step, db push fails with `ERROR: type "citext"
        # does not exist`. Sub-pattern 11 CI-parity fire #4
        # (schema-side change broke CI without pre-push parity
        # check): fires #1 JSX/ESLint Sprint 51, #2 env() ref
        # ajg/ci-hotfix, #3 Render DIRECT_URL value ajr/ajs, now
        # #4 Postgres extension ale/this-hotfix. Going-forward
        # extension to the canonical: when adding a custom Postgres
        # type (citext, hstore, postgis, etc.) to schema.prisma,
        # verify the CI workflow's schema-setup step can handle it.
        run: |
          psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS citext;"
          npx prisma db push --skip-generate
          npx prisma db seed

      - name: Build frontend (static export)
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E lifecycle test
        run: npx playwright test --reporter=list
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # ── E2E visibility (Item 254 → §13.3 Item 273.12 shape (a)) ──────────
      # E2E used to sit OUTSIDE the deploy gate — v3.8.asv put it there after
      # a Playwright browser-download hang ran six hours — and while it did,
      # this issue was the ONLY signal a red E2E existed at all: the workflow
      # read green, the deploy job succeeded, and §13.3 Item 273.11 measured
      # what that cost directly, more than once — the Render hook firing, the
      # migration applying, and the new process booting, all before E2E had
      # finished reporting. A red E2E on a pushed SHA stopped nothing.
      #
      # E2E is now IN the deploy gate (`deploy`'s own `needs:`, below), which
      # is what closes 273.11 — see that job's header comment for why waiting
      # on it is affordable now when it was not on 2026-08-19. A red run here
      # means the deploy job is SKIPPED, not merely unwatched: every commit
      # behind it is stuck until E2E is green again. That makes this issue
      # MORE load-bearing than before, not less — it is still the fastest way
      # to see "is E2E currently blocking shipping" without reading run
      # history, and it still closes itself the instant that stops being
      # true.
      #
      # A single pinned issue is the signal: opened on the first red, updated
      # rather than duplicated on each subsequent red, and closed on the next
      # green. The issue list therefore carries exactly one row while E2E is
      # broken and none when it is not — which is a state a person can check
      # at a glance, unlike a job buried in a green run.
      #
      # Push-to-main only. On a pull request a red E2E is already attached to
      # the PR the author is looking at, and commenting there too would train
      # people to ignore the issue.
      - name: Open or update the E2E red issue
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="E2E red"
          # Exact-title match over the open list rather than `--search`: the
          # search index is eventually consistent, so a search can miss an
          # issue opened minutes ago and duplicate it.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          BODY=$(printf '%s\n\n%s\n\n%s\n' \
            "E2E - Full Lifecycle Smoke failed on \`$GITHUB_SHA\`." \
            "Run: $RUN_URL" \
            "E2E blocks the deploy now (§13.3 Item 273.12 shape (a)) — this run's deploy did not fire. This issue is the signal that E2E is still red. It closes automatically on the next green E2E run on main.")
          if [ -n "$NUM" ]; then
            echo "Updating existing issue #$NUM"
            gh issue comment "$NUM" --body "$BODY"
          else
            echo "Opening the E2E red issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the E2E red issue
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="E2E red"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            echo "Closing issue #$NUM"
            gh issue close "$NUM" --comment "Green again on \`$GITHUB_SHA\`. Run: $RUN_URL"
          else
            echo "No open E2E red issue — nothing to close."
          fi

  # ─── Deploy ────────────────────────────────────────────────────────────
  # Gates the Render deploy on CI instead of letting a push deploy straight to
  # production regardless of result.
  #
  # The gap this closes, from the regression log: on 2026-08-19 commit 67dd1c41
  # was deployed by Render at 12:51:05 and its CI failed at 12:51:17. Render
  # auto-deploys on push and does not read GitHub Actions, so a red commit
  # reached production. That one was harmless (a dead export, no behaviour
  # change) but the same path ships a genuinely broken commit just as happily.
  #
  # needs is [backend, frontend, e2e] — it was DELIBERATELY [backend, frontend]
  # only, from the day this job was born until §13.3 Item 273.12 shape (a) was
  # taken. The reason it excluded e2e: on 2026-08-19, the same day this job
  # shipped, the E2E job hung for 6h02m on a Playwright browser download and
  # was killed by GitHub's job timeout — with no bound on the job at the time,
  # gating deploys on it would have blocked every deploy for that window over
  # an infrastructure hang unrelated to the code.
  #
  # That exclusion had a cost the timeout on e2e did not yet exist to bound:
  # §13.3 Item 273.11 measured it directly, more than once — the Render hook
  # firing, the migration applying, and the new process booting, all before
  # the E2E job had finished reporting. A red E2E on a pushed SHA stopped
  # nothing; the deploy had already shipped by the time anyone could know it
  # was red.
  #
  # The e2e job now carries `timeout-minutes: 25` (added after the 6h02m
  # hang — see that job's own header comment), which is what makes waiting on
  # it affordable: the worst case today is a 25-minute delay to a deploy, not
  # the unbounded block that justified the exclusion in the first place. §13.3
  # Item 273.12 named two ways to close 273.11 — shape (a), gate on e2e
  # outright, and shape (b), split the deploy into a migration-first /
  # bundle-second pair so a red e2e only holds the bundle. This is shape (a):
  # the one-line fix, taken because the timeout removed the reason it was
  # rejected the first time — not because the tradeoff it costs (every deploy
  # now waits as long as e2e takes, up to 25 minutes) stopped being real.
  #
  # __tests__/unit/ci/deployGate.test.ts now asserts e2e IS in this list, so a
  # later "fix" that pulls it back out to make deploys land faster reintroduces
  # exactly the gap Item 273.11 measured, and fails CI instead of doing it
  # quietly.
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    # Pushes to main only. A pull_request run must never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # WHY THIS FAILS RATHER THAN WARNS.
      #
      # It failed at first, then warned, and now fails again — and the reason it
      # changed twice is that the surrounding fact changed twice.
      #
      # It warned because the secret sat unset for a week while Render's own
      # auto-deploy shipped every commit. Seven pushes emailed a failure for
      # runs whose backend, frontend and E2E were all green. Unactionable red
      # teaches a reader to ignore CI mail, which costs more than the red was
      # guarding.
      #
      # Both halves of that are now false. The secret exists, and auto-deploy is
      # OFF as of 2026-09-04 — so this job is the ONLY path to production. An
      # absent secret no longer means "Render ships it anyway"; it means nothing
      # ships and the tick would say so in green. That is the silent outage the
      # warning branch's own comment warned about, arriving from the other
      # direction.
      #
      # It also gave the tick two meanings. "Deploy to Render = success" could
      # mean a deploy happened or that the job declined to deploy, and only a
      # log line told them apart — so reading the conclusion proved nothing
      # about whether anything shipped.
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL is not set, so nothing deployed. Render auto-deploy is OFF, so this job is the only path to production — see docs/internal/render-deploy-gate-setup.md."
            exit 1
          fi
          code=$(curl -sS -o /tmp/render-resp.txt -w "%{http_code}" -X POST "$HOOK")
          echo "Render responded HTTP $code"
          cat /tmp/render-resp.txt || true
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Render deploy hook returned HTTP $code — deploy NOT triggered."
            exit 1
          fi
          echo "Render deploy triggered for ${GITHUB_SHA}."
