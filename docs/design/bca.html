TIFACT 2 · INTERIOR PAGE MASTER ═══════════ -->\n<section class=\"page interior\" data-screen-label=\"Interior master\">\n  <header class=\"run-head\">\n    <span>SILK ROUTE LOGISTICS INC. &nbsp;·&nbsp; Broker-Carrier Agreement<\u002Fspan>\n    <span class=\"r\">Foundation Edition<\u002Fspan>\n  <\u002Fheader>\n  <div class=\"body\">\n    <div class=\"specimen\">Specimen text · placeholder body, replaced by injected content at build<\u002Fdiv>\n    <h2><span class=\"num\">1.<\u002Fspan>Term<\u002Fh2>\n    <p>This Broker-Carrier Agreement (the \"Agreement\") is entered into by and between Silk Route Logistics Inc., a Michigan corporation operating under FMCSA broker authority MC# 1794414 and USDOT# 4526880, with its principal place of business at 2317 S 35th St, Galesburg, MI 49053 (\"Broker\"), and the motor carrier identified on the execution page of this Agreement (\"Carrier\"). Broker arranges for the transportation of property by motor carrier on behalf of its shipper customers, and Carrier is a duly authorized motor carrier holding active operating authority and desires to provide such transportation services.<\u002Fp>\n    <p>The parties intend this Agreement to govern all shipments tendered by Broker to Carrier during its term. Each shipment shall be further described in a Rate Confirmation issued by Broker, which upon acceptance by Carrier is incorporated into and made a part of this Agreement.<\u002Fp>\n    <h2><span class=\"num\">2.<\u002Fspan>Carrier qualification and compliance<\u002Fh2>\n    <p>Carrier operates as an independent contractor with sole control over the manner and means of transportation. Nothing in this Agreement shall be construed to create an agency, employment, partnership, or joint-venture relationship between the parties. Carrier is exclusively responsible for its employees, drivers, equipment, and subcontractors, and for all wages, taxes, and benefits associated with them.<\u002Fp>\n    <h2><span class=\"num\">3.<\u002Fspan>Insurance<\u002Fh2>\n    <p>Carrier shall maintain, at its sole expense and for the duration of this Agreement: (a) Commercial General Liability and Automobile Liability coverage with combined single limits of not less than $1,000,000 per occurrence; (b) Cargo Liability coverage of not less than $100,000 per shipment; and (c) Workers' Compensation coverage as required by applicable law. Certificates of insurance naming Broker as certificate holder shall be furnished prior to the first tender of freight and upon each renewal.<\u002Fp>\n    <h2><span class=\"num\">4.<\u002Fspan>Double brokering and subcontracting<\u002Fh2>\n    <p>Carrier shall transport all freight tendered under this Agreement on equipment operated exclusively by Carrier. Carrier shall not re-broker, assign, interline, subcontract, or otherwise transfer any shipment to a third party without the prior written consent of Broker. Any violation of this Article constitutes a material breach, and Carrier shall indemnify Broker for all resulting loss, including consequential damages.<\u002Fp>\n  <\u002Fdiv>\n  <footer class=\"run-foot\">\n    <span>MC# 1794414 &nbsp;·&nbsp; DOT# 4526880 &nbsp;·&nbsp; silkroutelogistics.ai<\u002Fspan>\n    <span class=\"tag\">Where Trust Travels.<\u002Fspan>\n    <span>Page 2 of 3<\u002Fspan>\n  <\u002Ffooter>\n<\u002Fsection>\n\n<!-- ═══════════ ARTIFACT 3 · EXECUTION PAGE ═══════════ -->\n<section class=\"page interior\" data-screen-label=\"Execution page\">\n  <header class=\"run-head\">\n    <span>SILK ROUTE LOGISTICS INC. &nbsp;·&nbsp; Broker-Carrier Agreement<\u002Fspan>\n    <span class=\"r\">Foundation Edition<\u002Fspan>\n  <\u002Fheader>\n  <div class=\"body\">\n    <h2>Signatures<\u002Fh2>\n    <p class=\"exec-intro\">IN WITNESS WHEREOF, the parties have caused this Agreement to be executed by their duly authorized representatives as of the date last signed below. This Agreement may be executed electronically and in counterparts, each of which shall be deemed an original.
